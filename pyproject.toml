[project]
name = "arabizikit"
version = "0.4.0"
description = "Open-source Arabizi (Romanized Arabic) -> Arabic-script transliteration toolkit with dialect tagging, LLM-assisted disambiguation, and a reproducible benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammed Rabeeh Mattath", email = "rabeehily@gmail.com" }]
keywords = ["arabizi", "arabic", "nlp", "transliteration", "dialect", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
arabizikit = "arabizikit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
llm = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arabizikit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
